name: Build Android APK

permissions:
  contents: write

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/mobile-app-prayer-center-news-prux4y
    paths:
      - "app/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: "stable"

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter build apk --release --split-per-abi

      - run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: christ-vainqueur-app-release-apk
          path: |
            app/build/app/outputs/flutter-apk/*.apk
            app/build/app/outputs/bundle/release/*.aab
          retention-days: 30

      # Publie aussi les APK/AAB sur une branche dédiée (via git, pas de
      # stockage blob externe) pour permettre leur téléchargement depuis des
      # environnements dont l'accès réseau est restreint à github.com. Les
      # variantes "split per ABI" sont bien plus légères que l'APK universel ;
      # l'AAB est le format requis pour une soumission Google Play.
      - name: Publier les APK/AAB sur la branche apk-build
        run: |
          mkdir -p /tmp/apks
          cp build/app/outputs/flutter-apk/*.apk /tmp/apks/
          cp build/app/outputs/bundle/release/*.aab /tmp/apks/
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-build
          git reset --hard
          git clean -fd
          mkdir -p dist
          cp /tmp/apks/* dist/
          git add dist/
          git commit -m "APK/AAB release ${{ github.sha }}"
          git push --force origin apk-build
